name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build Docker images
        run: docker compose build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Go tests
        run: go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: |
          python -m py_compile face-search/service.py
          python -m py_compile tools/face-indexer/index_faces.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check internal/app/web/gallery.js
          node --check internal/app/web/settings.js
          node --check internal/app/web/app.js
          node --check internal/app/web/slideshow.js
